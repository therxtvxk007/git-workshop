name: e2e_v1
description: >
  M0 end-to-end walk on the synthetic world. Establishes that the temporal
  foundation holds and that a base-rate generator produces scoreable forecasts.
  It is not a measurement of real-world forecasting skill: the evidence is
  synthetic, the probabilities are uncalibrated and the outcome registry is
  machine-derived.

base_config: configs/base.yaml

backtest:
  start: "2026-01-07T00:00:00Z"
  end: "2026-03-04T00:00:00Z"
  step_days: 7
  horizon_days: 30

settings:
  generators:
    proposal_budget: 400
  evaluation:
    proposal_budgets: [25, 50, 100, 200]
