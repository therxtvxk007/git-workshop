[project]
name = "pramaan-x"
version = "0.5.0"
description = "Precursor-evidence retrieval cascade (stages 0-3); not a forecasting system"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "polars>=0.20",
  "duckdb>=0.10",
  "pyarrow>=15",
  "pydantic>=2.6",
]

[project.optional-dependencies]
boost   = ["lightgbm>=4.3", "xgboost>=2.0", "catboost>=1.2"]
torch   = ["torch>=2.2"]
serve   = ["fastapi>=0.110", "uvicorn>=0.29"]
llm     = ["httpx>=0.27"]
vector  = ["qdrant-client>=1.8"]
graph   = ["kuzu>=0.4", "neo4j>=5.18"]
track   = ["mlflow>=2.11"]
dev     = ["pytest>=8.0", "ruff>=0.3"]

[project.scripts]
pramaan = "pramaan_x.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pramaan_x*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  # FastAPI's dependency-injection idiom *is* a call in an argument default.
  # Rewriting it to satisfy the rule would break the framework contract.
  "B008",
  # Blind excepts here are deliberate degradation paths, each one commented at
  # the call site: a corrupt cache entry, an unreachable tracking server, a
  # display-only span failure. None of them may take down a forecast run.
  "BLE001",
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
