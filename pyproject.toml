[project]
name = "pramaan-x-zero-base"
version = "0.1.0"
description = "Cutoff-safe, open-world future-event forecasting: candidate discovery -> adjudication -> calibration -> risk-controlled alerting."
readme = "README.md"
license = { file = "LICENSE" }
# Bounded at both ends. The lower bound is what the code needs; the upper bound
# is what has actually been run. CI tests every minor version inside this range,
# and tests/contracts/test_packaging.py fails if the two disagree.
requires-python = ">=3.13,<3.15"
authors = [{ name = "PRAMAAN-X" }]
keywords = ["forecasting", "osint", "temporal-knowledge-graph", "conformal-risk-control", "calibration"]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "pydantic>=2.9",
  "polars>=1.0",
  "pyarrow>=17",
  "duckdb>=1.0",
  "typer>=0.12",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "scipy>=1.11",
  # [socks] so a SOCKS proxy works without a second install step.
  "httpx[socks]>=0.27",
]

[project.optional-dependencies]
dev = [
  "packaging>=24.0",  # version-specifier parsing in the packaging contract tests
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.scripts]
pramaanx = "pramaanx.cli:main"

[project.urls]
Homepage = "https://github.com/therxtvxk007/git-workshop"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pramaanx"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py313"  # lowest supported; keeps syntax portable across the range
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH", "DTZ", "T20"]
ignore = [
  "E501",    # line length handled by the formatter
  "B008",    # typer relies on defaults built by function calls
  "RUF012",  # pydantic/class attributes are not mutable-default hazards here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "T20"]
"scripts/**" = ["T20"]
"src/pramaanx/cli.py" = ["T20"]  # the CLI prints by design

[tool.mypy]
python_version = "3.13"
files = ["src/pramaanx"]
strict = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = []

[[tool.mypy.overrides]]
module = ["sklearn.*", "polars.*", "duckdb.*", "structlog.*", "yaml.*", "httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "network: test requires outbound network access (skipped by default)",
  "slow: long-running test",
]
filterwarnings = ["error::DeprecationWarning:pramaanx.*"]

[tool.coverage.run]
source = ["pramaanx"]
branch = true
# CLI commands are exercised in-process through Typer's CliRunner so their lines
# are measured normally. The two subprocess tests that prove the installed entry
# point works are not measured, and are not meant to be: they assert the script
# exists, which is a packaging fact, not a code path.
parallel = false
omit = []

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@overload",
  "\\.\\.\\.$",
]
