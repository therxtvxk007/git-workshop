notes:
- HydraNet is not implemented in this repository and must not be, under WP-B0. This record fixes the contract
  its future implementation would have to meet.
- 'Verified directly from the repository: URL resolves, licence is MIT, default branch is main, and the
  README names pyproject.toml, poetry.lock and environment.yml. The README''s paper link is a placeholder.'
- Units are temporally dependent, so the contract requires a moving-block bootstrap; an i.i.d. interval
  over adjacent months would be far too narrow.
- A secondary summary of the same paper reports average precision 0.138 for one-sided violence against
  the 0.162 recorded here, and attributes the value to VIEWS rather than to HydraNet. The two cannot be
  reconciled without the paper's own table, and it is not established which system either number belongs
  to. Resolve before any comparison is run.
