  and the entrypoint is `python -m evaluation.evaluate_submissions -s <submissions> -a <actuals>`.'
- The true-future window (July 2024 - June 2025) is already past, so this is a retrospective evaluation
  and the challenge's own held-out guarantee no longer applies to it. Any claim built on it must say so.
- Data arrives through a Dropbox link rather than a versioned release. Until it is hashed, no run against
  it can be shown to have used the same bytes twice.
