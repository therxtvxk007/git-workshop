notes:
- 'Verified directly from the repository: it exists, its default branch is main, it names requirements.txt,
  its README names the six datasets recorded above, and its entrypoint is `python run_all_baselines.py
  --methods REDSDS CP ACI CPTC AgACI DtACI MVP`.'
- 'Coverage is not a metric that improves monotonically: a method that over-covers is not better than
  one that hits its nominal rate. The primary metric is therefore the absolute deviation from nominal
  coverage, which is lower-is-better, and interval width is a secondary protection against buying coverage
  with uselessly wide intervals.'
- 'This is the most likely first reproduction of the eight families: CPU-only, small datasets, code released,
  and a clear entrypoint. The blockers are the unread licences and the unpinned commit, not compute.'
