notes:
- 'Unit of evaluation: district x monthly cutoff x event family. Occurrence and count are two targets
  on that same unit, which is what makes a paired comparison valid.'
- Training uses an expanding window; model selection uses a separate later window; calibration uses a
  third; and the final test window is frozen and sealed. Four windows, not two, because a calibrator fitted
  on the selection window inherits its selection bias.
- 'Reporting-delay rule: an event is only scoreable once the reporting delay for its source has elapsed
  past the end of the 30-day horizon. A cutoff whose horizon is still inside the delay window is right-censored
  and must be refused rather than scored, as tests/leakage already enforces for the pipeline.'
- 'District universe: the historical, effective-dated district set, so a district created by a later bifurcation
  cannot appear in an earlier cutoff''s universe. Using today''s district list retrospectively is a leak.'
- Dates are deliberately absent. They are blocked on measuring real-data completeness and must not be
  invented; the task brief says so, and a fabricated window would make every number downstream unfalsifiable.
- ACLED redistribution is prohibited, so redistribution_allowed is false. Data may be cached locally for
  a run but never committed to this repository or republished.
- 'No published score exists and none should: this is an internal track, not a reproduction of anyone''s
  paper. It can never reach status ''reproduced'' -- the statuses that apply to it are the blocked ones,
  then ''running''.'
