notes:
- The paper names this dataset ICE15; it corresponds to the ICEWS05-15 temporal knowledge graph benchmark.
- Scale is recorded as percentage by inference from Hit@k's bounded range, not by reading the paper. If
  the paper in fact reports fractions, every tolerance here is off by two orders of magnitude, so the
  inference must be confirmed before any reproduction is attempted.
- Whether the paper's ranking is time-aware filtered or raw is unresolved and changes Hit@1 substantially.
  It is a blocker, not a detail.
