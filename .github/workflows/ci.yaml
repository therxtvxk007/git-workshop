name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Network tests are excluded: CI must not depend on a third party's uptime,
  # and a green build must never mean "GDELT happened to be reachable".
  PYTEST_ARGS: -m "not network"

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install the project
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check src tests scripts

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest ${{ env.PYTEST_ARGS }} --cov=pramaanx --cov-report=term-missing

  m0-gate:
    name: M0 acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install the project
        run: uv sync --extra dev

      # The gate M0 exists for: future documents must not be able to change a
      # past cutoff, and identical inputs must reproduce identical reports.
      - name: Leakage and reproducibility gates
        run: uv run pytest tests/leakage tests/metamorphic tests/contracts -v

      - name: End-to-end demo runs offline
        run: |
          uv run python scripts/bootstrap_data.py \
            --from 2025-01-01T00:00:00Z --until 2026-04-01T00:00:00Z
          uv run pramaanx snapshot build --cutoff 2026-01-15T00:00:00Z
          uv run pramaanx audit leakage --cutoff 2026-01-15T00:00:00Z
          uv run pramaanx backtest --experiment configs/experiments/e2e_v1.yaml
