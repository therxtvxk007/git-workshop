name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"      # dedup and hashing must be bit-reproducible in CI
  # Loopback must reach loopback. A runner image that exports HTTP_PROXY would
  # otherwise send the smoke test's curl to the proxy instead of to the
  # container, and the job would be testing the proxy. Additive: everything
  # else still goes through whatever proxy the runner configures.
  NO_PROXY: "localhost,127.0.0.1,::1"
  no_proxy: "localhost,127.0.0.1,::1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install ruff
      - run: ruff check pramaan_x tests
      # `ruff format --check` is enforced, and only on the paths this project
      # has actually formatted. The rest of the tree predates the formatter and
      # is hand-wrapped; reformatting it would be a large diff through modules
      # nothing here changed. Listing the enforced paths keeps the gate real
      # instead of switching it off with continue-on-error, which is what it
      # used to be.
      - name: ruff format --check (formatted paths)
        run: |
          ruff format --check \
            pramaan_x/timestamps.py \
            pramaan_x/eval/availability.py \
            pramaan_x/eval/protocol.py \
            pramaan_x/eval/oracle_target_retrieval.py \
            pramaan_x/eval/invariants.py \
            pramaan_x/eval/artefact.py \
            pramaan_x/eval/harness.py \
            pramaan_x/eval/selection.py \
            tools/render_readme_results.py \
            tests/test_availability.py \
            tests/test_protocol.py \
            tests/test_artefact.py \
            tests/test_artefact_identity.py \
            tests/test_localhost_http.py \
            tests/test_retrieval.py \
            tests/test_documentation.py \
            tests/test_timestamp_policy.py \
            tests/test_controlled_ablation.py \
            tests/test_selection.py \
            tests/test_raw_pipeline_invariance.py \
            tests/test_container_build.py

  # The live-server tests must pass under a hostile proxy configuration, since
  # that is where they were reported broken. A SOCKS proxy with no `socksio`
  # installed reproduces it exactly.
  proxy-hostile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --all-extras
      - name: Live HTTP tests under a SOCKS proxy with socksio absent
        env:
          ALL_PROXY: socks5://127.0.0.1:9
          all_proxy: socks5://127.0.0.1:9
          NO_PROXY: ""
          no_proxy: ""
        run: uv run --no-sync pytest tests/test_llm_integration.py tests/test_localhost_http.py -q

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}", cache: pip}
      - run: pip install ".[boost,serve,llm,dev]"
      - name: Run tests
        run: pytest tests -q --durations=10

  # Proves the lockfile is the dependency specification, not decoration: a
  # fresh environment built from uv.lock alone must run the suite.
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: false}
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync pytest tests -q

  # oracle_target_retrieval. The strict method is the only one whose numbers
  # are results; the contaminated diagnostic runs beside it so the size of the
  # contamination stays visible. Both artefacts are uploaded.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --all-extras
      - name: oracle_target_retrieval (controlled pair + unpaired reproduction)
        run: |
          uv run --no-sync python -m pramaan_x.cli bench \
            --days 540 --seeds 20260824,11,29 \
            --methods strict,ablation,historical | tee benchmark.txt
      - name: README results match the artefacts
        run: uv run --no-sync python tools/render_readme_results.py --check
      - name: Assert the strict run passed every invariant
        run: |
          uv run --no-sync python - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path("benchmark_results/strict_temporal").rglob("*.json"):
              a = json.loads(p.read_text())
              for name, verdict in a["invariants"].items():
                  if verdict != "pass":
                      bad.append(f"{p}: {name} -> {verdict}")
              if a["availability_violations"]["total"]:
                  bad.append(f"{p}: {a['availability_violations']['total']} violations")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("strict_temporal artefacts clean")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-target-retrieval
          path: |
            benchmark.txt
            benchmark_results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pramaan-x:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name px -p 8000:8000 pramaan-x:ci
          # --noproxy '*' belongs on every one of these: the target is the
          # container on loopback, never something a proxy should forward.
          for _ in $(seq 1 30); do
            curl -fsS --noproxy '*' http://localhost:8000/health && break || sleep 2
          done
          curl -fsS --noproxy '*' http://localhost:8000/health
          curl -fsS --noproxy '*' -X POST http://localhost:8000/ingest/synthetic \
            -H 'Content-Type: application/json' -d '{"days":60}' > /dev/null
          curl -fsS --noproxy '*' -X POST http://localhost:8000/search \
            -H 'Content-Type: application/json' \
            -d '{"query":"reservoir spill threshold","k":3}' | head -c 400
          docker rm -f px
