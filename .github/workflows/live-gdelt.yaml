name: live GDELT smoke

# Manual only. Ordinary CI stays offline so that a green build means the code is
# correct, not that a third party was reachable. Run this when the GDELT
# connector changes, or to check egress from a new network.
on:
  workflow_dispatch:
    inputs:
      proxy:
        description: "Optional proxy URL (http://, https:// or socks5://)"
        required: false
        default: ""

jobs:
  live:
    name: fetch one export file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --extra dev
      - name: Fetch and parse one GDELT export file
        env:
          PRAMAANX_LIVE_GDELT: "1"
          PRAMAANX_HTTP_PROXY: ${{ inputs.proxy }}
        run: uv run pytest tests/network -m network -v
